name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Run test suite
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bash tests/run.sh
